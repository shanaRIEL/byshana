<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bga" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#EAE0D2"/>
      <stop offset="100%" stop-color="#D4C5AE"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B78F60"/>
      <stop offset="100%" stop-color="#8E6A41"/>
    </linearGradient>
    <filter id="bla" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="600" height="800" fill="url(#bga)"/>
  <g opacity="0.45" filter="url(#bla)">
    <polygon points="80,-40 320,-70 430,290 150,350" fill="#FFFFFF" opacity="0.5"/>
  </g>
  <ellipse cx="300" cy="662" rx="185" ry="22" fill="#8A7660" opacity="0.3" filter="url(#bla)"/>

  <!-- structured handbag -->
  <g transform="translate(150,300)">
    <rect x="0" y="60" width="300" height="200" rx="16" fill="url(#leather)" stroke="#5E4526" stroke-width="2.4"/>
    <path d="M56 60 q0 -78 94 -78 q94 0 94 78" fill="none" stroke="#5E4526" stroke-width="9" stroke-linecap="round"/>
    <rect x="122" y="140" width="56" height="44" rx="6" fill="#EFE4D2" stroke="#5E4526" stroke-width="2.4"/>
    <circle cx="150" cy="162" r="6" fill="#5E4526"/>
    <path d="M0 120 h300" stroke="#5E4526" stroke-width="1.6" opacity="0.5"/>
  </g>

  <!-- chelsea boot -->
  <g transform="translate(330,540)">
    <path d="M20 0 h84 v92 q40 10 60 26 q14 12 14 24 h-172 q-6 -18 4 -32 q12 -16 10 -40 z" fill="#2C2620" stroke="#141110" stroke-width="2"/>
    <path d="M20 44 h84" stroke="#C9B294" stroke-width="4"/>
    <rect x="8" y="136" width="184" height="14" rx="6" fill="#EFE4D2" stroke="#141110" stroke-width="2"/>
  </g>
</svg>
