<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#EDE4D6"/>
      <stop offset="55%" stop-color="#E3D8C7"/>
      <stop offset="100%" stop-color="#D8CBB7"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DCCBB2"/>
      <stop offset="100%" stop-color="#C9B294"/>
    </linearGradient>
    <linearGradient id="trouser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3129"/>
      <stop offset="100%" stop-color="#241E18"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="900" height="1200" fill="url(#wall)"/>

  <!-- soft window light -->
  <g opacity="0.5" filter="url(#soft)">
    <polygon points="120,-60 470,-140 700,420 300,520" fill="#FFFFFF" opacity="0.55"/>
    <polygon points="520,80 760,20 900,340 640,420" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <!-- cast shadow bands -->
  <g opacity="0.16">
    <polygon points="640,0 900,0 900,640 760,700" fill="#5C4A38"/>
    <polygon points="0,860 900,700 900,780 0,1010" fill="#5C4A38" opacity="0.6"/>
  </g>

  <!-- floor shadow -->
  <ellipse cx="450" cy="1062" rx="235" ry="34" fill="#8A7660" opacity="0.35" filter="url(#soft2)"/>

  <!-- trousers -->
  <path d="M372 700 h156 l22 330 h-70 l-30 -230 -30 230 h-70 z" fill="url(#trouser)"/>

  <!-- coat body -->
  <path d="M340 355
           q-18 6 -24 34
           l-30 250
           q-4 30 14 36
           q16 4 22 -22
           l16 -150
           v210
           q2 34 26 36
           h178
           q24 -2 26 -36
           v-210
           l16 150
           q6 26 22 22
           q18 -6 14 -36
           l-30 -250
           q-6 -28 -24 -34
           z" fill="url(#coat)" stroke="#8E7658" stroke-width="2"/>

  <!-- lapels -->
  <path d="M410 356 l40 118 -66 -40 z" fill="#E7D8C2" stroke="#8E7658" stroke-width="1.6"/>
  <path d="M490 356 l-40 118 66 -40 z" fill="#E7D8C2" stroke="#8E7658" stroke-width="1.6"/>

  <!-- collar -->
  <path d="M410 356 q40 26 80 0 l-12 -22 q-28 14 -56 0 z" fill="#CBB694" stroke="#8E7658" stroke-width="1.6"/>

  <!-- belt -->
  <rect x="342" y="548" width="216" height="26" rx="4" fill="#B99F7C" stroke="#8E7658" stroke-width="1.6"/>
  <rect x="430" y="542" width="40" height="38" rx="5" fill="none" stroke="#8E7658" stroke-width="3"/>

  <!-- buttons -->
  <circle cx="422" cy="470" r="6" fill="#8E7658"/>
  <circle cx="422" cy="512" r="6" fill="#8E7658"/>

  <!-- sleeve seams -->
  <path d="M348 400 q-16 90 -22 178" fill="none" stroke="#8E7658" stroke-width="1.6" opacity="0.7"/>
  <path d="M552 400 q16 90 22 178" fill="none" stroke="#8E7658" stroke-width="1.6" opacity="0.7"/>

  <!-- handbag still-life -->
  <g transform="translate(648,830)">
    <rect x="0" y="40" width="150" height="120" rx="12" fill="#B08D63" stroke="#6E5638" stroke-width="2"/>
    <path d="M28 40 q0 -46 47 -46 q47 0 47 46" fill="none" stroke="#6E5638" stroke-width="6" stroke-linecap="round"/>
    <rect x="58" y="86" width="34" height="26" rx="4" fill="#EFE4D2" stroke="#6E5638" stroke-width="2"/>
    <ellipse cx="75" cy="172" rx="86" ry="12" fill="#8A7660" opacity="0.3"/>
  </g>

  <!-- soft vignette -->
  <rect width="900" height="1200" fill="none"/>
</svg>
