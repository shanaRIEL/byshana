    <polygon points="60,-40 300,-80 420,300 140,360" fill="#FFFFFF" opacity="0.5"/>
  </g>
  <ellipse cx="300" cy="690" rx="160" ry="22" fill="#8A7660" opacity="0.3" filter="url(#blm)"/>

