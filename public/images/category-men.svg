<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#E9DFD0"/>
      <stop offset="100%" stop-color="#D6C8B2"/>
