    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E2823"/>
      <stop offset="100%" stop-color="#1A1512"/>
    </linearGradient>
    <filter id="blm" x="-30%" y="-30%" width="160%" height="160%">
